name: Native checks
on:
  push:
    branches: [main, develop, 'codex/**', 'wf/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current core with floating dependencies
        run: |
          npm --prefix core/js install --package-lock=false
          npm --prefix core/js run build
          python -m pip install --upgrade --upgrade-strategy eager ./core
      - name: Install native adapter and check tools
        working-directory: adapter
        run: python -m pip install . ruff pytest pytest-asyncio httpx build twine sphinx sphinx-rtd-theme myst-parser
      - name: Native tests, lint and documentation
        working-directory: adapter
        run: python scripts/check.py
      - name: Build and inspect adapter distributions
        working-directory: adapter
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed wheel and native exports
        working-directory: adapter
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I -c 'from gramlot_fastapi import *'
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: native-python-distributions
          path: adapter/dist/*
          if-no-files-found: error
