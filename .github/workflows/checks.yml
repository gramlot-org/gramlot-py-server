name: Checks
on:
  push:
    branches: [main, develop, 'codex/**', 'wf/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install '.[dev,docs]'
      - name: Lint, available tests and documentation
        run: python scripts/check.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c 'import gramlot_genro_asgi; from importlib.metadata import version; print(version("gramlot-genro-asgi"))'
