[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-flask"
version = "0.0.0.dev0"
description = "Gramlot applications hosted by Flask"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/gramlot_flask/_vendor/microblog/LICENSE"]
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=3.1,<4",
    "gramlot @ https://github.com/gramlot-org/gramlot-django/releases/download/v0.1.0-preview.1/gramlot-0.1.5-py3-none-any.whl#sha256=63466802618c8cbd3fed0a83e1072556085a31bd522477dbcfe1122417a26f4a",
]

[project.scripts]
gramlot-flask = "gramlot_flask.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
demo = ["flask-sqlalchemy>=3.1,<4", "flask-migrate>=4,<5", "flask-login>=0.6,<0.7",
        "flask-mail>=0.10,<1", "flask-moment>=1,<2", "flask-babel>=4,<5",
        "flask-wtf>=1.2,<2", "flask-httpauth>=4,<5", "elasticsearch>=8,<9",
        "redis>=5,<6", "rq>=1.15,<2", "python-dotenv>=1,<2", "langdetect>=1,<2",
        "pyjwt>=2,<3", "email-validator>=2,<3", "requests>=2,<3", "sqlalchemy>=2,<3"]
test = ["gramlot-flask[demo]", "pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.23"]
dev = ["gramlot-flask[test]", "ruff>=0.1.0", "mypy>=1.0", "build>=1.2", "twine>=5.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "sphinx-autodoc-typehints>=2.0", "myst-parser>=2.0"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-flask"
Repository = "https://github.com/gramlot-org/gramlot-flask"
"Bug Tracker" = "https://github.com/gramlot-org/gramlot-flask/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_flask"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/docs_llm", "/scripts", "/hooks", "/examples", "/ports", "/uv.lock", "/pyproject.toml", "/README.md", "/SPECIFICATION.md", "/CONTRIBUTING.md", "/AGENTS.md", "/LICENSE", "/NOTICE"]
exclude = ["/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/gramlot_flask/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "src/gramlot_flask/_vendor/"]
