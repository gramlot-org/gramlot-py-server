name: tests

# One job per framework adapter, each installed with its own extra only.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  published-core:
    # Required: each adapter against the Gramlot core released on PyPI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        framework: [uvicorn, django, flask, fastapi, kajenn]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the released core and the adapter with its extra
        run: python -m pip install "gramlot>=0.2.12" -e ".[${{ matrix.framework }},test]" coverage
      - name: Show the core version
        run: python -m pip show gramlot
      - name: Test with coverage
        run: |
          python -m coverage run -m pytest -q tests/${{ matrix.framework }}
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          flags: ${{ matrix.framework }}
          disable_search: true
          fail_ci_if_error: false

  repository:
    # Required: the tests that span the repository, such as the README blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "gramlot>=0.2.12" -e ".[test]"
      - run: python -m pytest -q tests/test_readme.py tests/test_cli.py tests/test_gallery.py

  browser:
    # Required: the five adapters under a mount path and the gallery of each environment, in Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "gramlot>=0.2.12" -e ".[uvicorn,django,flask,fastapi,kajenn,gallery]"
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-fund --no-audit playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_ENTRY=$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Adapters under /py
        run: node scripts/verify_browser.mjs "$(command -v python)" "$PLAYWRIGHT_ENTRY" chromium
      - name: Gallery of every environment
        run: node scripts/verify_gallery_browser.mjs "$(command -v python)" "$PLAYWRIGHT_ENTRY" chromium

  install:
    # Required: gramlot <environment> new and gallery from a clean install of the built wheel.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [uvicorn, django, flask, fastapi, kajenn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-fund --no-audit playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_ENTRY=$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel -o dist .
      - name: New project and gallery from a clean install
        run: python scripts/verify_install.py ${{ matrix.framework }} dist/gramlot_py_server-*.whl "$PLAYWRIGHT_ENTRY" chromium

  core-main:
    # Informational: every adapter against the main branch of gramlot-org/gramlot.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: gramlot-py-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: gramlot-py-server
      - name: Check out the core at main
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: gramlot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the core browser runtime
        working-directory: gramlot
        run: |
          npm --prefix js install --ignore-scripts --package-lock=false
          npm --prefix js run build
      - name: Install the core in editable mode and every adapter
        run: python -m pip install -e ../gramlot -e ".[uvicorn,django,flask,fastapi,kajenn,test]"
      - name: Test
        run: python -m pytest -q

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: python scripts/check_docs.py
