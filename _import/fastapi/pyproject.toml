[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-fastapi"
version = "0.1.0a1"
description = "Gramlot applications hosted by FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115",
    "genro-bag",
    "genro-tytx[msgpack]",
    "gramlot",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
gramlot-fastapi = "gramlot_fastapi.__main__:main"

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<3"]
test = ["gramlot-fastapi[sqlalchemy]", "pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
dev = ["gramlot-fastapi[test]", "ruff>=0.1.0", "mypy>=1.0", "build>=1.2", "twine>=5.0"]
docs = ["sphinx>=8.2,<9", "sphinx-rtd-theme>=3,<4", "myst-parser>=4,<6"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-fastapi"
Repository = "https://github.com/gramlot-org/gramlot-fastapi"
"Bug Tracker" = "https://github.com/gramlot-org/gramlot-fastapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_fastapi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/docs_llm", "/scripts", "/hooks", "/examples", "/pyproject.toml", "/README.md", "/SPECIFICATION.md", "/CONTRIBUTING.md", "/LICENSE", "/NOTICE"]
exclude = ["/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_gramlot-framework"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]
