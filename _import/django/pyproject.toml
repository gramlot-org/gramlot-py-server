[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-django"
version = "0.1.0"
description = "Gramlot applications hosted by Django"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gramlot",
    "Django>=5.2,<6.1",
    "asgiref>=3.8.1,<4",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.23"]
dev = ["gramlot-django[test]", "ruff>=0.1.0", "mypy>=1.0", "build>=1.2", "twine>=5.0"]
docs = ["Sphinx>=8.2,<9", "sphinx-rtd-theme>=3,<4", "myst-parser>=4,<6"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-django"
Repository = "https://github.com/gramlot-org/gramlot-django"
"Bug Tracker" = "https://github.com/gramlot-org/gramlot-django/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_django"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/docs_llm", "/scripts", "/hooks", "/examples", "/historical", "/pyproject.toml", "/README.md", "/SPECIFICATION.md", "/CONTRIBUTING.md", "/LICENSE", "/NOTICE"]
exclude = ["/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The preserved PoC suite configures Django before model imports.
"historical/tests/test_django_adapter.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]
