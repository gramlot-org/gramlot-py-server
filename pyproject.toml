[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-py-server"
version = "0.2.3"
description = "Python server adapters for Gramlot pages: Uvicorn, Django, Flask, FastAPI and Kajenn"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
dependencies = ["gramlot>=0.2.5"]

[project.optional-dependencies]
uvicorn = ["uvicorn>=0.30"]
fastapi = ["fastapi>=0.115"]
flask = ["flask>=3.1,<4"]
django = ["Django>=5.2,<6.2", "asgiref>=3.8.1,<4"]
kajenn = ["kajenn>=0.1.0"]
gallery = ["gramlot-examples>=0.2.5"]
test = ["gramlot-examples>=0.2.5", "pytest>=7.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "httpx>=0.27", "genro-tytx[msgpack]"]
docs = ["Sphinx==8.2.3", "sphinx-rtd-theme==3.1.0", "myst-parser==5.1.0"]

[project.scripts]
gramlot = "gramlot_py_server.cli:main"

[project.entry-points."gramlot_py_server.commands"]
uvicorn = "gramlot_py_server.uvicorn:commands"
django = "gramlot_py_server.django:commands"
flask = "gramlot_py_server.flask:commands"
fastapi = "gramlot_py_server.fastapi:commands"
kajenn = "gramlot_py_server.kajenn:commands"

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-py-server"
Repository = "https://github.com/gramlot-org/gramlot-py-server"
Issues = "https://github.com/gramlot-org/gramlot-py-server/issues"
Documentation = "https://gramlot-py-server.readthedocs.io/"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_py_server"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/docs_llm", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["gramlot_py_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "examples/", "src/gramlot_py_server/templates/", "src/gramlot_py_server/gallery/[a-z]+/"]

[[tool.mypy.overrides]]
# gramlot and Django ship no type information.
module = ["gramlot.*", "django.*"]
ignore_missing_imports = true
